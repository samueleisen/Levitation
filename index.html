<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Flight</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #07090e;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        #instructions {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            letter-spacing: 0.05em;
            pointer-events: none;
            text-transform: uppercase;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>
    <div id="canvas-container"></div>
    <div id="instructions">WASD : Move &nbsp;|&nbsp; SPACE : Jump &nbsp;|&nbsp; SHIFT : Sprint &nbsp;|&nbsp; Drag :
        Rotate View</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { HairPhysics } from './hairphysic.js';

        // --- Core State ---
        let scene, camera, renderer, controls;
        let currentModel = null;
        const characterRoot = new THREE.Group();
        const clock = new THREE.Clock();
        const hairPhysics = new HairPhysics();

        // --- Character Movement State ---
        const moveState = {
            forward: false,
            backward: false,
            left: false,
            right: false,
            jump: false,
            sprint: false
        };

        const charPhysics = {
            velocityY: 0,
            isGrounded: true,
            gravity: -24,
            jumpForce: 14.0,
            baseSpeed: 5.0,
            sprintMultiplier: 1.8,
            targetRotation: 0,
            currentRotation: 0,
            walkCycle: 0
        };

        init();

        function init() {
            const container = document.getElementById('canvas-container');

            // 1. Scene & Camera
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x07090e);
            scene.fog = new THREE.FogExp2(0x07090e, 0.018);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
            camera.position.set(0, 2.0, 4.5);

            // 2. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 3. Lighting
            const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.7);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 1.8);
            sunLight.position.set(6, 12, 6);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.set(1024, 1024);
            sunLight.shadow.bias = -0.0005;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 40;
            sunLight.shadow.camera.left = -8;
            sunLight.shadow.camera.right = 8;
            sunLight.shadow.camera.top = 8;
            sunLight.shadow.camera.bottom = -8;
            scene.add(sunLight);

            const fillLight = new THREE.DirectionalLight(0x818cf8, 0.8);
            fillLight.position.set(-6, 4, -6);
            scene.add(fillLight);

            // 4. Procedural Ground (0 textures, 1 draw call, 2 triangles, distance faded)
            scene.add(createProceduralGround());

            // 5. Character Hierarchy
            scene.add(characterRoot);

            // 6. Camera Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.02;
            controls.minDistance = 1.2;
            controls.maxDistance = 30;
            controls.target.set(0, 1.0, 0);
            controls.update();

            // 7. Load GLB & Hair Physics
            loadCharacter('./test004rigged.glb');

            // 8. Event Listeners
            window.addEventListener('resize', onWindowResize);
            setupInput();

            // 9. Start Loop
            animate();
        }

        // Procedural Infinite Grid Shader Plane (Ultra-lightweight)
        function createProceduralGround() {
            const size = 300;
            const geometry = new THREE.PlaneGeometry(size, size, 1, 1);
            geometry.rotateX(-Math.PI / 2);

            const material = new THREE.ShaderMaterial({
                uniforms: {
                    uBaseColor: { value: new THREE.Color(0x07090e) },
                    uGridSub: { value: new THREE.Color(0x131926) },
                    uGridMain: { value: new THREE.Color(0x233148) },
                    uFadeDistance: { value: 70.0 }
                },
                vertexShader: `
                    varying vec3 vWorldPos;
                    void main() {
                        vec4 worldPos = modelMatrix * vec4(position, 1.0);
                        vWorldPos = worldPos.xyz;
                        gl_Position = projectionMatrix * viewMatrix * worldPos;
                    }
                `,
                fragmentShader: `
                    varying vec3 vWorldPos;
                    uniform vec3 uBaseColor;
                    uniform vec3 uGridSub;
                    uniform vec3 uGridMain;
                    uniform float uFadeDistance;

                    float computeGrid(vec2 pos, float stepSize, float thickness) {
                        vec2 coord = pos / stepSize;
                        vec2 grid = abs(fract(coord - 0.5) - 0.5) / fwidth(coord);
                        float line = min(grid.x, grid.y);
                        return 1.0 - min(line * thickness, 1.0);
                    }

                    void main() {
                        vec2 pos = vWorldPos.xz;
                        float dist = length(pos);
                        float fade = smoothstep(uFadeDistance, 0.0, dist);

                        float fineGrid = computeGrid(pos, 1.0, 1.0);
                        float coarseGrid = computeGrid(pos, 5.0, 0.7);

                        vec3 color = uBaseColor;
                        color = mix(color, uGridSub, fineGrid * 0.6);
                        color = mix(color, uGridMain, coarseGrid * 0.9);

                        gl_FragColor = vec4(color, fade);
                    }
                `,
                transparent: true,
                depthWrite: true
            });

            return new THREE.Mesh(geometry, material);
        }

        async function loadCharacter(url) {
            const loader = new GLTFLoader();
            loader.load(url, async (gltf) => {
                currentModel = gltf.scene;

                // Configure Shadows
                currentModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                // Auto-center X/Z and align to ground baseline (Y = 0)
                const box = new THREE.Box3().setFromObject(currentModel);
                const center = box.getCenter(new THREE.Vector3());
                const restOffset = new THREE.Vector3(-center.x, 0, -center.z);
                currentModel.position.copy(restOffset);
                currentModel.userData.restOffset = restOffset.clone();

                characterRoot.add(currentModel);
                characterRoot.updateMatrixWorld(true);

                // Init Hair Physics
                hairPhysics.reset();
                const config = await hairPhysics.fetchConfig('./hair-config.json');
                hairPhysics.init(currentModel, config);
                await hairPhysics.fetchColliders('./glb-collider.json');
            });
        }

        function updateCharacter(delta) {
            if (!currentModel) return;

            const baseY = currentModel.userData?.restOffset ? currentModel.userData.restOffset.y : 0;
            const inputX = (moveState.right ? 1 : 0) - (moveState.left ? 1 : 0);
            const inputZ = (moveState.backward ? 1 : 0) - (moveState.forward ? 1 : 0);
            const isMoving = inputX !== 0 || inputZ !== 0;

            if (isMoving) {
                const camAngle = Math.atan2(
                    camera.position.x - controls.target.x,
                    camera.position.z - controls.target.z
                );
                const inputAngle = Math.atan2(inputX, inputZ);
                charPhysics.targetRotation = camAngle + inputAngle;

                const currentSpeed = charPhysics.baseSpeed * (moveState.sprint ? charPhysics.sprintMultiplier : 1.0);
                const speed = currentSpeed * delta;
                const moveDir = new THREE.Vector3(Math.sin(charPhysics.targetRotation), 0, Math.cos(charPhysics.targetRotation));

                const prevPos = characterRoot.position.clone();
                characterRoot.position.addScaledVector(moveDir, speed);

                // Camera follow
                const displacement = characterRoot.position.clone().sub(prevPos);
                camera.position.add(displacement);
                controls.target.add(displacement);

                // Walk animation bobbing
                charPhysics.walkCycle += delta * (moveState.sprint ? 14 : 9);
                currentModel.position.y = baseY + Math.abs(Math.sin(charPhysics.walkCycle)) * 0.05;
            } else {
                currentModel.position.y = THREE.MathUtils.lerp(currentModel.position.y, baseY, delta * 10);
            }
            currentModel.rotation.z = 0;

            // Smooth character rotation
            let angleDiff = charPhysics.targetRotation - charPhysics.currentRotation;
            angleDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));
            charPhysics.currentRotation += angleDiff * Math.min(delta * 12.0, 1.0);
            characterRoot.rotation.y = charPhysics.currentRotation;

            // Jump & Gravity
            const prevY = characterRoot.position.y;
            if (!charPhysics.isGrounded) {
                charPhysics.velocityY += charPhysics.gravity * delta;
                characterRoot.position.y += charPhysics.velocityY * delta;

                if (characterRoot.position.y <= 0) {
                    characterRoot.position.y = 0;
                    charPhysics.velocityY = 0;
                    charPhysics.isGrounded = true;
                }
            }
            const deltaY = characterRoot.position.y - prevY;
            camera.position.y += deltaY;
            controls.target.y += deltaY;
        }

        function setupInput() {
            const keyMap = {
                KeyW: 'forward', ArrowUp: 'forward',
                KeyS: 'backward', ArrowDown: 'backward',
                KeyA: 'left', ArrowLeft: 'left',
                KeyD: 'right', ArrowRight: 'right',
                ShiftLeft: 'sprint', ShiftRight: 'sprint'
            };

            window.addEventListener('keydown', (e) => {
                if (keyMap[e.code]) moveState[keyMap[e.code]] = true;
                if (e.code === 'Space' && charPhysics.isGrounded) {
                    charPhysics.velocityY = charPhysics.jumpForce;
                    charPhysics.isGrounded = false;
                }
            });

            window.addEventListener('keyup', (e) => {
                if (keyMap[e.code]) moveState[keyMap[e.code]] = false;
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);

            // 1. Update Character
            updateCharacter(delta);

            // 2. Update Hair Physics
            if (hairPhysics) {
                characterRoot.updateMatrixWorld(true);
                hairPhysics.update(delta);
            }

            // 3. Orbit Controls & Render
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>

</html>
